# Railway configuration for Egg9 Backend
#
# Variables managed in Railway dashboard (NOT here):
#   - APP_KEY                        (secret)
#   - CRON_SECRET                    (secret, referenced by cron services)
#   - DB_HOST   ${{MySQL.MYSQLHOST}}
#   - DB_PORT   ${{MySQL.MYSQLPORT}}
#   - DB_PASSWORD ${{MySQL.MYSQL_ROOT_PASSWORD}}
#   - MAIL_PASSWORD                  (secret)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# --- Production ---
[environments.production.deploy]
preDeployCommand = "php artisan migrate --force"

[environments.production.variables]
APP_NAME = "Egg9"
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://egg9backend-production.up.railway.app"
APP_MAINTENANCE_DRIVER = "file"
APP_LOCALE = "en"
APP_FALLBACK_LOCALE = "en"
APP_FAKER_LOCALE = "en_US"
FRONTEND_URL = "https://egg9.up.railway.app"
LOG_CHANNEL = "stack"
LOG_STACK = "single"
LOG_DEPRECATIONS_CHANNEL = "null"
LOG_LEVEL = "info"
DB_CONNECTION = "mysql"
DB_DATABASE = "egg9"
DB_USERNAME = "root"
QUEUE_CONNECTION = "sync"
BROADCAST_CONNECTION = "log"
FILESYSTEM_DISK = "local"
CACHE_STORE = "database"
SESSION_DRIVER = "database"
SESSION_LIFETIME = "120"
SESSION_ENCRYPT = "false"
SESSION_PATH = "/"
SESSION_DOMAIN = "null"
BCRYPT_ROUNDS = "12"
MEMCACHED_HOST = "127.0.0.1"
MAIL_MAILER = "smtp"
MAIL_HOST = "smtp.gmail.com"
MAIL_PORT = "587"
MAIL_ENCRYPTION = "tls"
MAIL_FROM_ADDRESS = "egg9nine@gmail.com"
MAIL_FROM_NAME = "Egg9"
MAIL_USERNAME = "egg9nine@gmail.com"

# --- Staging ---
[environments.staging.deploy]
preDeployCommand = "php artisan migrate --force"

[environments.staging.variables]
APP_NAME = "Egg9 Staging"
APP_ENV = "staging"
APP_DEBUG = "false"
APP_URL = "https://egg9backend-staging.up.railway.app"
APP_MAINTENANCE_DRIVER = "file"
APP_LOCALE = "en"
APP_FALLBACK_LOCALE = "en"
APP_FAKER_LOCALE = "en_US"
FRONTEND_URL = "https://egg9frontend-staging.up.railway.app"
LOG_CHANNEL = "stack"
LOG_STACK = "single,stderr"
LOG_DEPRECATIONS_CHANNEL = "null"
LOG_LEVEL = "debug"
DB_CONNECTION = "mysql"
DB_DATABASE = "egg9"
DB_USERNAME = "root"
QUEUE_CONNECTION = "sync"
BROADCAST_CONNECTION = "log"
FILESYSTEM_DISK = "local"
CACHE_STORE = "database"
SESSION_DRIVER = "database"
SESSION_LIFETIME = "120"
SESSION_ENCRYPT = "false"
SESSION_PATH = "/"
SESSION_DOMAIN = "null"
BCRYPT_ROUNDS = "12"
MEMCACHED_HOST = "127.0.0.1"
MAIL_MAILER = "array"
MAIL_HOST = "smtp.gmail.com"
MAIL_PORT = "587"
MAIL_ENCRYPTION = "tls"
MAIL_FROM_ADDRESS = "egg9nine@gmail.com"
MAIL_FROM_NAME = "Egg9"
MAIL_USERNAME = "egg9nine@gmail.com"
